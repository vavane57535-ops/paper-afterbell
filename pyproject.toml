[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afterbell"
version = "0.1.0"
description = "Afterbell — IA de trading crypto auto-apprenante avec simulation massive, paper trading et lancement réel sécurisé."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "ccxt>=4.3",
  "cryptography>=42",
  "httpx>=0.27",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
afterbell = "afterbell.__main__:main"

[tool.setuptools.packages.find]
include = ["afterbell*"]

[tool.setuptools.package-data]
afterbell = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
